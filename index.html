<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Coach</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="hdr-left"><h1>English Coach</h1>
<div class="hdr-row"><div class="mode-seg" role="group" aria-label="模式"><button type="button" class="mode-btn on" data-testid="mode-all" aria-pressed="true">全部</button><button type="button" class="mode-btn" data-testid="mode-review" aria-pressed="false">复习</button></div>
<button type="button" class="undo-btn" data-testid="undo" disabled>恢复上一个</button>
<button type="button" class="undo-btn" data-testid="settings-open">设置</button></div>
<span id="sync-status" data-testid="sync-status" data-sync-status></span></div>
<div id="stats" data-testid="stats"></div></header>
<main id="app" data-testid="app">加载中…</main>
<footer id="history" data-testid="history"></footer>
<div id="settings" class="settings" data-testid="settings" hidden>
<form data-testid="settings-form">
<h2>同步设置</h2>
<label>App ID<input type="text" name="appid" data-testid="sync-app-id" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="LeanCloud App ID"></label>
<label>App Key<input type="password" name="appkey" data-testid="sync-app-key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="App Key"></label>
<label>服务器地址<input type="url" name="server" data-testid="sync-server" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://xxxx.lc-cn-n1-shared.com"></label>
<label>记录 ID<input type="text" name="object" data-testid="sync-object-id" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="留空后点创建"></label>
<p class="hint" data-testid="sync-hint">国内 LeanCloud，不用 VPN。只填 App Key，不要填 Master Key。Class 名必须是 ECState。服务器地址从控制台「应用凭证」复制；留空则用华北测试域名。记录 ID 留空时点创建云端记录。</p>
<button type="button" class="ghost" data-testid="sync-create">创建云端记录</button>
<p class="hint sync-msg" data-sync-status data-testid="sync-status-panel"></p>
<div class="row2 row">
<button type="submit" class="primary" data-testid="sync-save">保存</button>
<button type="button" class="ghost" data-testid="settings-close">关闭</button>
</div>
<button type="button" class="ghost" data-testid="sync-clear">停止同步</button>
</form>
</div>
<script src="sync.js"></script>
<script src="app.js"></script></body></html>

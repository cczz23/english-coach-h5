<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Coach</title><link rel="stylesheet" href="style.css"></head>
<body><header>
<div class="hdr-top"><div class="hdr-left"><h1>English Coach</h1>
<span id="sync-status" data-testid="sync-status" data-sync-status></span></div>
<div id="stats" data-testid="stats"></div></div>
<div class="mix-caption" data-testid="mix-label">新词 50%</div>
<div class="mix-row" role="group" aria-label="新词与复习比例">
<button type="button" class="mix-end" data-testid="mode-new" aria-pressed="false">新词</button>
<input type="range" min="0" max="100" step="5" value="50" data-testid="mix" aria-label="新词与复习比例" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
<button type="button" class="mix-end" data-testid="mode-review" aria-pressed="false">复习</button>
</div>
<div class="hdr-row">
<button type="button" class="undo-btn" data-testid="weak-list-open">生疏列表</button>
<button type="button" class="undo-btn" data-testid="undo" disabled>恢复上一个</button>
<button type="button" class="undo-btn" data-testid="settings-open">设置</button>
</div>
<button type="button" class="sleep-entry" data-testid="sleep-list-open">沉睡清单</button>
</header>
<main id="app" data-testid="app">加载中…</main>
<footer id="history" data-testid="history"></footer>
<div id="settings" class="settings" data-testid="settings" hidden>
<form data-testid="settings-form">
<h2>同步设置</h2>
<label>环境 ID<input type="text" name="env" data-testid="sync-env" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="cloud1-xxxx"></label>
<label>Publishable Key<input type="password" name="publishable" data-testid="sync-publishable" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Publishable Key"></label>
<label>记录 ID<input type="text" name="doc" data-testid="sync-doc-id" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="留空后点创建或绑定"></label>
<p class="hint" data-testid="sync-hint">腾讯云开发，国内可用，不用 VPN。只填 Publishable Key，不要填 API 密钥。集合名必须是 ec_state。请用云开发静态托管打开（免费版 github.io CORS 会被拦）。记录 ID 留空时点创建或绑定；已有 ID 则绑定同一条。</p>
<button type="button" class="ghost" data-testid="sync-create">创建或绑定</button>
<p class="hint sync-msg" data-sync-status data-testid="sync-status-panel"></p>
<div class="row2 row">
<button type="submit" class="primary" data-testid="sync-save">保存</button>
<button type="button" class="ghost" data-testid="settings-close">关闭</button>
</div>
<button type="button" class="ghost" data-testid="sync-clear">停止同步</button>
</form>
</div>
<div id="weak-list" class="settings" data-testid="weak-list" hidden>
<div class="sheet-panel">
<h2>还不熟的词</h2>
<div class="weak-list-body" data-testid="weak-list-body"></div>
<button type="button" class="ghost" data-testid="weak-list-close">关闭</button>
</div>
</div>
<div id="sleep-list" class="settings" data-testid="sleep-list" hidden>
<div class="sheet-panel">
<h2>沉睡清单</h2>
<p class="hint" data-testid="sleep-list-hint">看过多次后再放掉的词，偶尔拿出来复习。</p>
<div class="weak-list-body" data-testid="sleep-list-body"></div>
<button type="button" class="ghost" data-testid="sleep-list-close">关闭</button>
</div>
</div>
<script src="sync.js"></script>
<script src="queue.js"></script>
<script src="app.js"></script></body></html>
